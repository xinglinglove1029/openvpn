services:
  openvpn:
    image: xinglinglove1029/openvpn:latest
    build:
      context: .
      dockerfile: build/Dockerfile
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "1194:1194/udp"
      - "8888:8888"
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      OVPN_GATEWAY: "true"
      # 默认使用东八区；如需其他时区，可在宿主机 .env 或执行命令时设置 TZ。
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
