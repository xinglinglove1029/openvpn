[unix_http_server]
file=/run/supervisord.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:openvpn]
command=/usr/bin/docker-entrypoint.sh /usr/sbin/openvpn
autostart=yes
autorestart=true
stopasgroup=true
killasgroup=true
priority=999

redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:openvpn-web]
command=/usr/local/bin/openvpn-web
autostart=yes
autorestart=true
stopasgroup=true
killasgroup=true
priority=100

redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

# Ollama 本地大模型服务（容器内集成，监听 127.0.0.1:11434）
[program:ollama]
command=/bin/sh -c "mkdir -p ${OLLAMA_MODELS} && exec /usr/local/bin/ollama serve"
environment=OLLAMA_HOST="%(ENV_OLLAMA_HOST)s",OLLAMA_MODELS="%(ENV_OLLAMA_MODELS)s"
autostart=yes
autorestart=true
stopasgroup=true
killasgroup=true
priority=50

redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

# 首次启动自动拉取默认模型（oneshot，跑完即退出）
[program:ollama-bootstrap]
command=/usr/local/bin/ollama-bootstrap.sh
autostart=yes
autorestart=false
startsecs=0
startretries=3
priority=60

redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
